---
layout: default
---

<h1>Projects</h1>

<ul>
{% for project in site.data.projects %}
    <li>
        <a href="{{ project.url }}">{{ project.name }}</a> - {{ project.description }}
    </li>
{% endfor %}
</ul>

<h1>Posts</h1>

<ul>
{% for post in site.posts %}
    <li>
        {{ post.date | date_to_string}} - <a href="{{ post.url }}">{{ post.title }}</a>
    </li>
{% endfor %}
</ul>
